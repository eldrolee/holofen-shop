<title>Holofen 宝可梦卡牌店</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Rubik:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: clean white shop. Pokémon-style accents: red + blue + yellow, with the five energy-type colours as a stripe under the header and as dots. */
:root{
  --bg:#ffffff;--surface:#ffffff;--ink:#14254a;--muted:#5d6785;--line:#e3e7f0;
  --sun:#f6b93b;--sun-ink:#14254a;--red:#0e7c86;--on-red:#ffffff;--accent:#1c8fc4;--blue:#1c8fc4;--on-blue:#ffffff;
  --up:#178a4c;--down:#d2331f;--note:#fff6d1;--note-ink:#5a4300;--tile:#f4f6fb;--soft:#f4f6fb;
  --fire:#f08030;--water:#4a90e2;--grass:#5fbd58;--elec:#f7c81e;--psy:#c765d0;--shadow:0 6px 18px rgba(20,37,74,.08);--fx:.12;
  --display:"Baloo 2","Rubik","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --body:"Nunito Sans",-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--num:"Rubik",-apple-system,sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
}
:root,:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
::selection{background:var(--sun);color:var(--sun-ink)}
input,textarea{caret-color:var(--red)}
html{scrollbar-color:var(--line) transparent;accent-color:var(--red)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid var(--bg)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(30px,5.2vw,48px);font-weight:800;letter-spacing:-.02em}
h1 small,h2 small{display:block;font-family:var(--display);font-weight:500;font-size:.5em;color:var(--muted);letter-spacing:.02em}
h2{font-size:clamp(22px,3vw,28px);font-weight:700;letter-spacing:-.01em}
h2 small{font-size:.6em}
h3{font-size:16px;font-weight:700}
p{margin:0}
.en{color:var(--muted);font-size:.86em}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
header.bar::after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--red) 0 20%,var(--water) 20% 40%,var(--grass) 40% 60%,var(--elec) 60% 80%,var(--psy) 80%)}
header.bar.adm{background:var(--ink);color:var(--bg)}
.bar .wrap{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--display);font-weight:800;font-size:18px;white-space:nowrap;padding-block:8px;display:flex;align-items:center;gap:6px}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:10px;opacity:.7;line-height:1}
nav.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}
nav.tabs a{padding:8px 10px;white-space:nowrap;text-decoration:none;color:inherit;font-size:13.5px;line-height:1.15;border-radius:10px;text-align:center;opacity:.75}
nav.tabs a:hover{background:var(--soft);opacity:1}
nav.tabs a i{display:block;font-style:normal;font-size:10px;opacity:.8}
nav.tabs a.on{color:var(--red);opacity:1;font-weight:700;box-shadow:inset 0 -3px 0 var(--red);border-radius:10px 10px 0 0}
.adm nav.tabs a.on{color:var(--sun);box-shadow:inset 0 -3px 0 var(--sun)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}
main{padding-block:24px 72px}
.sec{margin-top:28px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted);font-size:13px}
.note{background:var(--note);color:var(--note-ink);padding:10px 14px;border-radius:12px;font-size:13px}
.note .en{color:inherit;opacity:.8}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:var(--surface)}
.chip.tbd{background:var(--note);color:var(--note-ink);border-color:var(--note-ink)}
.chip.bad{color:var(--down);border-color:var(--down);white-space:normal}
button,.btn{font:inherit;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 16px;border-radius:12px;min-height:40px;transition:transform 160ms var(--ease-out),background-color 160ms ease,border-color 160ms ease,color 160ms ease}
button:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){button,.btn{transition:none}button:active{transform:none}}
button.pri{background:var(--red);color:var(--on-red);border-color:var(--red);font-weight:700;font-family:var(--display)}
button.sun{background:var(--sun);color:var(--sun-ink);border-color:var(--sun);font-weight:700;font-family:var(--display)}
button.sun:hover{background:#ffd633;border-color:#ffd633}
button.on{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
button:hover{border-color:var(--blue)}
button.pri:hover{filter:brightness(1.07);border-color:var(--red)}
button .en{color:inherit;opacity:.75}
.cartbtn{white-space:nowrap;background:var(--red);color:var(--on-red);border-color:var(--red);font-weight:700;font-family:var(--display);display:inline-flex;align-items:center;gap:6px;border-radius:99px}
.cartbtn svg{flex:none}
@media (max-width:640px){.cartbtn .ct{display:none}.cartbtn{padding:9px 12px}.brand small{display:none}}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:80px}
label.f,fieldset.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0;flex:1 1 200px;border:0;padding:0;margin:0}
fieldset.f legend{padding:0;margin-bottom:4px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:99px;cursor:pointer;font-size:13.5px}
.opts label .en{color:inherit;opacity:.7}
.opts label:has(input:checked){background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-weight:700}
.opts input{position:absolute;opacity:0;width:0;height:0}
.opts label:has(input:focus-visible){outline:2px solid var(--red);outline-offset:2px}
.price{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%}
/* marquee */
.mq{overflow:hidden;padding-block:6px}
.mq .track{display:flex;gap:14px;width:max-content;animation:slide 90s linear infinite}
.mq.rev .track{animation-direction:reverse;animation-duration:110s}
.mq:hover .track{animation-play-state:paused}
.mq figure{margin:0;width:132px;flex:none}
.mq img{width:132px;height:184px;object-fit:contain;border-radius:8px;background:var(--tile);box-shadow:0 4px 12px rgba(20,37,74,.18);display:block}
.mq figcaption{font-size:11px;line-height:1.3;padding-top:5px;color:var(--muted);overflow-wrap:anywhere}
@keyframes slide{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.mq{overflow-x:auto}.mq .track{animation:none}}
/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;position:relative;transition:transform .2s cubic-bezier(.16,1,.3,1),box-shadow .2s cubic-bezier(.16,1,.3,1)}
.prod:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(20,37,74,.14)}
@media (prefers-reduced-motion:reduce){.prod,.prod:hover{transition:none;transform:none}}
.prod .pic{background:var(--tile);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:8px;cursor:pointer;border:0;border-radius:0;width:100%}
.prod .pic img{max-height:100%;object-fit:contain}
.prod .info{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.prod .nm{font-weight:700;font-size:13.5px;line-height:1.3;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left;border-radius:0;color:var(--ink)}
.bigp{font-family:var(--num);font-weight:700;font-size:22px;color:var(--red);line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.prod .was{font-family:var(--mono);font-size:12px;color:var(--muted);text-decoration:line-through}
.save{position:absolute;top:8px;left:8px;background:var(--red);color:var(--on-red);font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.prod .foot{margin-top:auto;padding-top:8px}
.prod .foot button{width:100%}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--soft)}
th i{display:block;font-style:normal;font-weight:400;font-size:10.5px}
td.n,th.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.th img{width:40px;height:56px;object-fit:contain;background:var(--tile);border-radius:4px;display:block;max-width:none}
.up{color:var(--up)}.down{color:var(--down)}
.pill{display:inline-block;min-width:78px;text-align:right;padding:2px 8px;border-radius:6px;font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.pill.up{background:var(--up);color:var(--surface)}.pill.down{background:var(--down);color:var(--surface)}.pill.flat{background:var(--muted);color:var(--surface)}
.tape{background:#14254a;color:#eef1fa;border-radius:12px;overflow:hidden;font-family:var(--mono);font-size:12.5px}
.tape .track{display:flex;gap:28px;width:max-content;padding:8px 14px;animation:slide 120s linear infinite;white-space:nowrap}
.tape b.up{color:var(--grass)}.tape b.down{color:var(--fire)}.tape b.flat{color:inherit}
@media (prefers-reduced-motion:reduce){.tape{overflow-x:auto}.tape .track{animation:none}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:14px;padding:10px 14px;min-width:0}
.kpi:nth-child(5n+2){border-top-color:var(--red)}.kpi:nth-child(5n+3){border-top-color:var(--grass)}.kpi:nth-child(5n+4){border-top-color:var(--elec)}.kpi:nth-child(5n+5){border-top-color:var(--psy)}
.kpi b{font-family:var(--display);font-size:26px;display:block;line-height:1.1}
/* news */
.news article{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:start}
.nthumb{width:84px;height:84px;border-radius:12px;background:var(--tile);display:grid;place-items:center;overflow:hidden}
.nthumb img{max-height:78px;width:auto;object-fit:contain}
.news article:last-child{border-bottom:0}
.news time{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px}
@media (max-width:520px){.news article{grid-template-columns:64px minmax(0,1fr);gap:10px}.nthumb{width:64px;height:64px}.nthumb img{max-height:60px}}
.share{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:6px 10px;align-items:center;font-size:13px}
.share .b{height:14px;background:var(--blue);border-radius:99px;min-width:3px}
.share .b.top{background:var(--red)}
/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px}
.gcard{perspective:900px;margin:0}
.gcard .in{position:relative;border-radius:12px;overflow:hidden;transition:transform .15s ease-out;box-shadow:0 8px 22px rgba(20,37,74,.22);background:var(--tile)}
.gcard img{display:block;width:100%}
.gcard .sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:0;transition:opacity .2s;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.55),transparent 45%),linear-gradient(115deg,transparent 30%,rgba(255,170,60,.3) 45%,rgba(255,90,160,.25) 55%,transparent 70%)}
.gcard:hover .sheen{opacity:1}
.gcard figcaption{padding-top:10px;font-size:13px}
@media (prefers-reduced-motion:reduce){.gcard .in{transition:none;transform:none!important}}
/* orders */
.steps{display:flex;flex-wrap:wrap;gap:4px;font-size:12px}
.steps span{padding:3px 10px;border-radius:99px;border:1.5px solid var(--line);color:var(--muted);line-height:1.25;text-align:center}
.steps span i{display:block;font-style:normal;font-size:10px}
.steps span.done{background:var(--soft);color:var(--ink)}
.steps span.now{background:var(--sun);color:var(--sun-ink);border-color:var(--sun);font-weight:700}
.order{display:flex;flex-direction:column;gap:10px}
.buddy{display:flex;gap:10px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.buddy svg{flex:none}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:30;max-width:90vw}
pre.list{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;margin:0}
.stars button{border:0;background:none;font-size:26px;padding:0 2px;color:var(--line)}
.stars button.on{color:var(--sun);background:none}
.modal{position:fixed;inset:0;z-index:20;background:rgba(16,22,43,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px}
.modal{animation:fade 180ms ease-out}
.modal .box{animation:pop 220ms var(--ease-out);background:var(--surface);border-radius:20px;max-width:760px;width:100%;max-height:100%;overflow:auto;padding:20px;display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:20px;align-items:start}
.modal .box>img{background:var(--tile);border-radius:12px;width:100%}
@media (max-width:600px){.modal .box{grid-template-columns:1fr}.modal .box>img{max-width:200px;margin:0 auto}}
.types{display:flex;flex-wrap:wrap;gap:6px}
.types span{font-size:12px;font-weight:700;color:#fff;padding:3px 10px;border-radius:99px}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22400%22%20height%3D%22400%22%20viewBox%3D%220%200%20400%20400%22%3E%3Cg%20transform%3D%22translate%2830%2040%29%20rotate%28-12%2020%2020%29%20scale%281.3%29%22%3E%3Cpath%20d%3D%22M23%203L9%2022h9l-4%2015%2016-21h-9z%22%20fill%3D%22%23f7c81e%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28230%2020%29%20rotate%288%2020%2020%29%20scale%281.1%29%22%3E%3Cpath%20d%3D%22M20%203c6%209%2010%2013%2010%2019a10%2010%200%200%201-20%200c0-6%204-10%2010-19z%22%20fill%3D%22%234a90e2%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28140%20130%29%20rotate%280%2020%2020%29%20scale%281.2%29%22%3E%3Cpath%20d%3D%22M7%2034C7%2017%2018%207%2034%206c0%2016-10%2027-27%2028z%22%20fill%3D%22%235fbd58%22/%3E%3Cpath%20d%3D%22M9%2032L28%2013%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28300%20170%29%20rotate%280%2020%2020%29%20scale%280.8%29%22%3E%3Cpath%20d%3D%22M20%203l3.5%2013.5L37%2020l-13.5%203.5L20%2037l-3.5-13.5L3%2020l13.5-3.5z%22%20fill%3D%22%23e3350d%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2840%20230%29%20rotate%2810%2020%2020%29%20scale%281.25%29%22%3E%3Cpath%20d%3D%22M20%203c2%207%209%209%209%2017a9%209%200%200%201-18%200c0-5%203-7%205-9%200%203%201%205%203%205-1-5%200-9%201-13z%22%20fill%3D%22%23f08030%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28220%20260%29%20rotate%28-8%2020%2020%29%20scale%281.1%29%22%3E%3Cellipse%20cx%3D%2220%22%20cy%3D%2220%22%20rx%3D%2216%22%20ry%3D%2210%22%20fill%3D%22%23c765d0%22/%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2220%22%20r%3D%225%22%20fill%3D%22%23fff%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28110%2020%29%20rotate%280%2020%2020%29%20scale%280.55%29%22%3E%3Cpath%20d%3D%22M20%203l3.5%2013.5L37%2020l-13.5%203.5L20%2037l-3.5-13.5L3%2020l13.5-3.5z%22%20fill%3D%22%23e3350d%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28330%20330%29%20rotate%2815%2020%2020%29%20scale%280.9%29%22%3E%3Cpath%20d%3D%22M23%203L9%2022h9l-4%2015%2016-21h-9z%22%20fill%3D%22%23f7c81e%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%28150%20330%29%20rotate%280%2020%2020%29%20scale%280.7%29%22%3E%3Cpath%20d%3D%22M20%203c6%209%2010%2013%2010%2019a10%2010%200%200%201-20%200c0-6%204-10%2010-19z%22%20fill%3D%22%234a90e2%22/%3E%3C/g%3E%3Cg%20transform%3D%22translate%2820%20350%29%20rotate%280%2020%2020%29%20scale%280.6%29%22%3E%3Cpath%20d%3D%22M20%203l3.5%2013.5L37%2020l-13.5%203.5L20%2037l-3.5-13.5L3%2020l13.5-3.5z%22%20fill%3D%22%23e3350d%22/%3E%3C/g%3E%3C/svg%3E");background-size:400px 400px;opacity:var(--fx)}
.intro{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
nav.sub{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:4px;width:max-content;max-width:100%}
nav.sub a{padding:6px 14px;border-radius:99px;text-decoration:none;color:var(--ink);white-space:nowrap;font-size:14px}
nav.sub a .en{font-size:11px}
nav.sub a.on{background:var(--surface);color:var(--red);font-weight:700;box-shadow:0 1px 4px rgba(20,37,74,.15)}
.cartbtn.here{box-shadow:0 0 0 3px var(--sun)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}}
@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}}
.toast:not([hidden]){animation:rise 200ms var(--ease-out)}
@media (prefers-reduced-motion:reduce){.modal,.modal .box,.toast:not([hidden]){animation:none}}
.lead{font-size:17px;max-width:62ch}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{position:relative;overflow:hidden;text-align:left;border:0;border-radius:16px;padding:16px 16px 0;min-height:200px;display:flex;flex-direction:column;gap:2px;color:#14254a;font-family:var(--display);transition:transform 200ms var(--ease-out)}

/* animated hero 2026-11-12: aurora in the brand colours (idea from 21st.dev "AuroraBackground", rewritten in plain CSS) + holo sheen on the card marquee */
.hero{position:relative;isolation:isolate;overflow:hidden;border-radius:24px;border:1px solid var(--line);background:var(--surface);padding:clamp(20px,4vw,40px) 0 10px;display:flex;flex-direction:column;gap:18px;--px:50%;--py:30%}
.hero .hero-in{padding-inline:clamp(16px,4vw,40px);position:relative}
.hero .aur{position:absolute;inset:-25%;z-index:-2;filter:blur(64px);opacity:.5;pointer-events:none}
.hero .aur i{position:absolute;width:46%;aspect-ratio:1;border-radius:50%;will-change:transform}
.hero .aur i:nth-child(1){background:var(--sun);left:8%;top:6%;animation:aur1 16s ease-in-out infinite alternate}
.hero .aur i:nth-child(2){background:var(--red);right:6%;top:2%;width:38%;opacity:.75;animation:aur2 19s ease-in-out infinite alternate}
.hero .aur i:nth-child(3){background:var(--water);left:30%;bottom:4%;width:52%;opacity:.8;animation:aur3 22s ease-in-out infinite alternate}
.hero .aur i:nth-child(4){background:var(--psy);right:18%;bottom:14%;width:26%;opacity:.6;animation:aur1 14s ease-in-out infinite alternate-reverse}
@keyframes aur1{to{transform:translate(18%,14%) scale(1.15)}}
@keyframes aur2{to{transform:translate(-22%,18%) scale(.9)}}
@keyframes aur3{to{transform:translate(12%,-16%) scale(1.1)}}
.hero .spot{position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(420px circle at var(--px) var(--py),rgba(255,255,255,.55),transparent 60%)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,transparent 55%,var(--surface) 100%);opacity:.6}
.hero h1{animation:heroUp .8s var(--ease-out) both}
.hero .hero-in .row{animation:heroUp .8s .15s var(--ease-out) both}
.hero-mq{animation:heroUp .9s .3s var(--ease-out) both}
@keyframes heroUp{from{opacity:0;transform:translateY(14px)}}
.hero .pri{box-shadow:0 8px 20px rgba(14,124,134,.28)}
.hero .mq figure{position:relative}
.hero .mq figure::after{content:"";position:absolute;left:0;top:0;width:132px;height:184px;border-radius:8px;pointer-events:none;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.7) 48%,rgba(255,220,120,.35) 52%,transparent 62%);background-size:300% 100%;background-position:120% 0;mix-blend-mode:screen;animation:sheen 5s ease-in-out infinite}

/* 一段中文：先查字典，再试规则，"A · B · C" 这类逐段翻 */
function trT(t){ if(lang!=="en"||typeof t!=="string") return t; const k=t.trim(); if(!/[㐀-鿿]/.test(k)) return t;
  if(TR[k]!=null) return t.replace(k,TR[k]);
  for(const [re,to] of TRX) if(re.test(k)) return t.replace(k,k.replace(re,to));
  if(k.includes(" · ")){ const parts=k.split(" · ").map(x=>TR[x.trim()]!=null?TR[x.trim()]:x); if(!parts.some(x=>/[㐀-鿿]/.test(x))) return t.replace(k,parts.join(" · ")) }
  const m=k.match(/^(.*?[㐀-鿿）」。！？：])\s*([A-Z][\x20-\x7e’—–é：]*)$/); if(m&&/[a-z]/.test(m[2])) return t.replace(k,m[2].replace(/：/g,": ").replace(/: $/,""));
  return t }
window.trT=trT;
function langPass(){
  const CJK=/[㐀-鿿]/, SEL=".en,h1>small,h2>small,nav.tabs a>i,th>i,.steps span i";
  document.querySelectorAll(SEL).forEach(el=>{ let n=el.previousSibling;
    while(n){ const prev=n.previousSibling;
      if(n.nodeType===3){ if(CJK.test(n.nodeValue)){ const sp=document.createElement("span"); sp.className="zh"; n.replaceWith(sp); sp.appendChild(n) } }
      else if(n.nodeType===1){ if(n.matches(SEL)||n.querySelector(SEL)) break;
        if(CJK.test(n.textContent)){ n.classList.add("zh"); const d=getComputedStyle(n).display; if(d!=="inline"&&d!=="inline-block") break } }
      n=prev } });
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:t=>CJK.test(t.nodeValue)&&!t.parentElement.closest(".zh,.tr,script,style")?1:3});
  const todo=[]; while(w.nextNode()) todo.push(w.currentNode);
  todo.forEach(t=>{ const v=trT(t.nodeValue); if(v===t.nodeValue) return; const a=document.createElement("span"); a.className="zh"; const b=document.createElement("span"); b.className="tr"; b.textContent=v; t.replaceWith(a,b); a.appendChild(t) });
  document.querySelectorAll("[placeholder],[title],[aria-label],img[alt]").forEach(el=>{ for(const at of ["placeholder","title","aria-label","alt"]){ const p=el.getAttribute(at); if(!p||!CJK.test(p)) continue; let v=trT(p); if(v===p){ const m=p.match(/[A-Za-z][^\u3400-\u9fff]*$/); if(m) v=m[0] } if(v!==p) el.setAttribute(at,v) } });
}

function cartTotals(){
  const sub=cart.reduce((a,c)=>a+item(c.id).price*c.qty,0);
  const onlySvc=cart.length>0&&cart.every(c=>item(c.id).svc);
  const sh=SHIP.find(s=>s.k===(ui.ship||"wm")); const fee=onlySvc?0:sh.fee;
  const cp=couponsOf(uid).find(c=>c.code===ui.coupon&&!c.used&&sub>=c.min); const mb=member(uid), R=mb.R;
  const maxU=Math.min(Math.floor(mb.left/R.redeemPts),Math.floor(Math.max(0,sub-(cp?cp.amount:0))/R.redeemRM||0)), pts=Math.min(ui.pts||0,maxU*R.redeemPts), ptsOff=pts/R.redeemPts*R.redeemRM;
  const off=(cp?cp.amount:0)+ptsOff;
  return {sub,fee,off,total:Math.max(0,sub+fee-off),cp,onlySvc,sh,mb,maxU,pts,ptsOff};
}

function quoted(u,o){ const a=((admS[u]||{}).o||{})[cleanId(o.id)]||{}; const q=num(a.quote); return isFinite(q)&&q>0?q:0 }

/* 积分抽奖：店主在后台设奖品和每次要几分，每次保存是一个新的「期」，带一个随机种子。
   顾客第 n 次抽的结果 = 哈希(顾客编号:n:种子) 按权重落在哪个奖品，任何人都能重算，顾客改不了结果。
   店主后台打开时会把看到的抽奖记录抄一份到 site/lucky，顾客事后删掉记录也照样扣分。 */
let LUCKY={on:false,rounds:[],log:{},sent:{},ci:{}}, luckyQ=Promise.resolve(), luckyT=null;
function normLucky(d){ d=d&&typeof d==="object"?d:{};
  const rounds=arr(d.rounds).filter(r=>r&&typeof r==="object").slice(-20).map(r=>({id:cleanId(r.id),at:num(r.at)||0,cost:clampN(r.cost,1,1e6),seed:cleanId(r.seed),miss:Math.max(0,num(r.miss)||0),prizes:arr(r.prizes).slice(0,20).map(p=>({id:cleanId(p.id),name:cleanTxt(p.name,60),w:Math.max(0,num(p.w)||0)})).filter(p=>p.id&&p.name)})).filter(r=>r.id&&r.seed);
  const log={}; const l0=d.log&&typeof d.log==="object"?d.log:{}; Object.keys(l0).slice(0,2000).forEach(u=>{ log[u]=arr(l0[u]).slice(-300).map(normDraw).filter(Boolean) });
  const sent={}; const s0=d.sent&&typeof d.sent==="object"?d.sent:{}; Object.keys(s0).slice(0,5000).forEach(k=>{ if(s0[k]===true) sent[k]=true });
  const ci={}; const c0=d.ci&&typeof d.ci==="object"?d.ci:{}; Object.keys(c0).slice(0,5000).forEach(u=>{ const x=c0[u]; if(x&&typeof x==="object") ci[u]={seen:arr(x.seen).filter(v=>typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v)).slice(-400),at:num(x.at)||0} });
  return {on:d.on===true,rounds,log,sent,ci} }
function normDraw(x){ if(!x||typeof x!=="object") return null; const n=clampN(x.n,0,1e6); if(!n) return null; return {n,r:cleanId(x.r),cost:clampN(x.cost,0,1e6),at:num(x.at)||0} }
function h01(str){ let h=2166136261>>>0; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0 }
  h^=h>>>16; h=Math.imul(h,0x85ebca6b)>>>0; h^=h>>>13; h=Math.imul(h,0xc2b2ae35)>>>0; h^=h>>>16; return (h>>>0)/4294967296 }
function drawRes(u,n,r){ const tot=r.prizes.reduce((a,p)=>a+p.w,0)+r.miss; if(!(tot>0)) return ""; let t=h01(u+":"+n+":"+r.seed)*tot; for(const p of r.prizes){ if(t<p.w) return p.id; t-=p.w } return "" }
const curRound=()=>LUCKY.rounds.length?LUCKY.rounds[LUCKY.rounds.length-1]:null;
/* 某位顾客的有效抽奖：同一个 n 以店主抄下的为准；只认当期，或者店主已经抄下的旧期 */
function luckyDraws(u){ const me=(typeof MEALL!=="undefined"&&MEALL[u])||{}, logged=arr(LUCKY.log[u]), by={}, cur=curRound();
  arr(me.draws).forEach(d=>{ by[d.n]={...d,logged:false} }); logged.forEach(d=>{ by[d.n]={...d,logged:true} });
  return Object.values(by).sort((a,b)=>a.n-b.n).map(d=>{ const r=LUCKY.rounds.find(x=>x.id===d.r); const ok=!!r&&d.cost===r.cost&&(d.logged||(cur&&r.id===cur.id)); const win=ok?drawRes(u,d.n,r):""; const pz=win?r.prizes.find(p=>p.id===win):null;
    return {...d,ok,round:r,win,prize:pz?pz.name:"",key:u+":"+d.n} }) }

/* 店主端：把看到的抽奖记录抄进 site/lucky（有变化才写，合并 2 秒内的变化） */
function syncLog(){ if(!owner||typeof MEALL==="undefined") return; let ch=false; const log={...LUCKY.log};
  Object.entries(MEALL).forEach(([u,m])=>{ const have=new Set(arr(log[u]).map(d=>d.n)); const add=arr(m&&m.draws).filter(d=>!have.has(d.n)&&LUCKY.rounds.some(r=>r.id===d.r)); if(add.length){ log[u]=arr(log[u]).concat(add).sort((a,b)=>a.n-b.n).slice(-300); ch=true } });
  const ci={...(LUCKY.ci||{})}; Object.keys(MEALL).forEach(u=>{ const ok=ciValid(u), old=ci[u]?ci[u].seen:[]; if(ok.some(d=>!old.includes(d))){ ci[u]={seen:ok.slice(-400),at:Date.now()}; ch=true } }); LUCKY.ci=ci;
  if(!ch) return; LUCKY.log=log; clearTimeout(luckyT); luckyT=setTimeout(saveLucky,2000) }

/* ---------- v36 每日签到 ----------
   顾客每天按一次「签到」得 rules.ciPts 分，连续第 7、14、21… 天再加 rules.ci7 分。日期按马来西亚时间。
   日期写在顾客自己的 me/<id>.ci。为了防止有人一次补写很多天：店主后台打开时会把看到的日期抄进 site/lucky 的 ci；
   店主还没看过的日期，只算店主上次看过的前一天之后（第一次最多往回 7 天）。 */
const dayStr=t=>new Date(t+8*3600e3).toISOString().slice(0,10);
const dayAdd=(d,n)=>dayStr(Date.parse(d+"T00:00:00+08:00")+n*864e5);
function ciValid(u){ const me=(typeof MEALL!=="undefined"&&MEALL[u])||{}, rec=(LUCKY.ci||{})[u]||null, today=dayStr(Date.now());
  const seen=new Set(rec?rec.seen:[]), from=rec?dayAdd(dayStr(rec.at),-1):dayAdd(today,-7);
  return [...new Set(arr(me.ci).concat(rec?rec.seen:[]))].filter(d=>d<=today&&(seen.has(d)||d>=from)).sort() }
function ciPoints(u,R){ const ds=ciValid(u); let pts=0, run=0, prev=""; ds.forEach(d=>{ run=prev&&dayAdd(prev,1)===d?run+1:1; prev=d; pts+=R.ciPts+(run%7===0?R.ci7:0) }); return pts }
function ciStreak(u){ const ds=ciValid(u), today=dayStr(Date.now()); let d=ds.includes(today)?today:dayAdd(today,-1), n=0; while(ds.includes(d)){ n++; d=dayAdd(d,-1) } return n }
const ciDone=()=>arr(ME.ci).includes(dayStr(Date.now()));
function doCheckin(){ if(ciDone()) return toast("今天已经签到了"); const R=rules(), streak=ciStreak(XU)+1;
  ME.ci=arr(ME.ci).concat(dayStr(Date.now())).slice(-400); ui.ciNow=1;
  saveMe().then(()=>toast(`签到成功 +${R.ciPts+(streak%7===0?R.ci7:0)} 分`)) }
function ciPanel(){ const R=rules(), done=ciDone(), st=ciStreak(XU), today=dayStr(Date.now()), ds=new Set(ciValid(XU));
  const week=Array.from({length:7},(_,i)=>dayAdd(today,i-6));
  return `<div class="panel stack ci" style="gap:10px"><div class="row" style="justify-content:space-between"><div><span class="lbl">${B("每日签到","Daily check-in")}</span><h3 style="margin:2px 0">${B(`已连续 ${st} 天`,`${st}-day streak`)}</h3></div>
   ${done?`<span class="chip">${B("今天已签到 ✓","Checked in today ✓")}</span>`:`<button class="pri" data-ci="1">${B(`签到 +${R.ciPts} 分`,`Check in +${R.ciPts}`)}</button>`}</div>
   <div class="cidays">${week.map(d=>`<span class="${ds.has(d)?"on":""}${d===today?" td":""}"><i>${ds.has(d)?"✓":""}</i><small>${d===today?B("今天","Today"):+d.slice(8)+(isEN()?"":"日")}</small></span>`).join("")}</div>
   <p class="muted" style="margin:0">${B(`每天签到得 ${R.ciPts} 分，连续 7 天再送 ${R.ci7} 分（${B("再签","")} ${7-(st%7)} ${B("天就有","")}）。中间断一天就从头算。积分可以抽奖，也可以结账抵钱。`,`${R.ciPts} pts a day, +${R.ci7} bonus every 7 days in a row. Use points in the lucky draw or at checkout.`)}</p></div>` }

function add(id,brief,q){ const p=item(id); if(!p) return; if(!p.svc&&!sellable(p)) return toast("这件暂时缺货 Out of stock");
  q=clampN(q||1,1,99);
  if(p.svc){ cart=cart.filter(c=>!item(c.id).svc); cart.push({id,qty:1,brief}) }
  else { const c=cart.find(c=>c.id===id), cap=p.stock>0&&!isPre(p)?p.stock:99, cur=c?c.qty:0, nq=Math.min(cap,cur+q); if(nq<=cur) return toast("库存只有 "+cap+" 件 Only "+cap+" in stock"); c?c.qty=nq:cart.push({id,qty:nq}); if(nq<cur+q) toast("库存只有 "+cap+" 件，已帮你加到上限") }
  saveCart(); toast(isEN()?"Added: "+(p.svc?p.en:(p.loose?p.s+" loose packs × "+q:pname(p))):"已加入购物车："+(p.svc?p.n:(p.loose?p.s+" 散包 × "+q:PN(p)))); }

async function takeFiles(files){
  const s=formState();
  for(const f of files){
    if(ui.files.length>=5){ toast("最多 5 个文件 Up to 5 files"); break }
    if(f.type.startsWith("image/")){
      if(!assets){ toast("这里暂时收不了照片，请用文字清单"); continue }
      if(ui.files.filter(x=>x.kind==="img").length>=3){ toast("照片最多 3 张 Up to 3 photos"); continue }
      try{ const r=await assets.upload(f); ui.files.push({name:f.name,kind:"img",id:r.id}) }catch(e){ toast("照片上传失败 Upload failed："+f.name) }
    } else {
      if(f.size>20000){ toast(f.name+" 超过 20KB，请删减后再传"); continue }
      try{ ui.files.push({name:f.name,kind:"text",text:await f.text()}) }catch(e){ toast("读不了这个文件："+f.name) }
    }
  }
  render(); restoreForm(s);
}

<script>
/* 滚动浮现和换页动画 */
(function(){ if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  var view=document.getElementById("view"), tick=0, navT=Date.now()+600, pt=0, H=document.documentElement;
  var ITEMS=".prod,.mc,.ctl,.brow,.panel.news article,.wgrid>*,.hgo";
  var io=("IntersectionObserver" in window)?new IntersectionObserver(function(es){ var k=0; es.forEach(function(e){ if(e.isIntersecting||e.boundingClientRect.top<0){ e.target.style.setProperty("--rd",(Math.min(k++,7)*0.045)+"s"); e.target.classList.add("in"); io.unobserve(e.target) } }) },{rootMargin:"0px 0px -4% 0px"}):null;
  function show(){ tick=0; view.querySelectorAll(".rv:not(.in)").forEach(function(n){ if(n.getBoundingClientRect().top<innerHeight*0.94) n.classList.add("in") }) }
  var lastH=location.hash;
  function hook(){ if(location.hash!==lastH){ lastH=location.hash; navT=Date.now()+450; H.classList.remove("pgin"); void view.offsetWidth } var nav=Date.now()<navT;
    view.querySelectorAll(":scope > section, :scope > .sec, :scope > .panel, :scope > .tw, :scope > .legend").forEach(function(n){ if(n.classList.contains("rv")||n.getBoundingClientRect().top<innerHeight*0.94) return; n.classList.add("rv") });
    if(io) view.querySelectorAll(ITEMS).forEach(function(n){ if(n.classList.contains("ri")) return; var t=n.getBoundingClientRect().top; if(!nav&&t<innerHeight) return; n.classList.add("ri"); io.observe(n) });
    if(nav&&!H.classList.contains("pgin")){ H.classList.add("pgin"); clearTimeout(pt); pt=setTimeout(function(){ H.classList.remove("pgin") },1200) } }
  setInterval(function(){ view.querySelectorAll(".ri:not(.in)").forEach(function(n){ var r=n.getBoundingClientRect(); if(r.height&&r.top<innerHeight&&r.bottom>0) n.classList.add("in") }) },1500);
  addEventListener("scroll",function(){ if(!tick) tick=requestAnimationFrame(show) },{passive:true}); addEventListener("resize",show);
  new MutationObserver(hook).observe(view,{childList:true}); hook();
})();
</script>
