# 这个仓库已经接到 Cloudflare Worker「holofen-shop」。
# main 分支的构建跑 `npx wrangler deploy`，其他分支跑 `npx wrangler preview`。
# 不要再另建一个 Pages 项目。
name = "holofen-shop"
main = "worker/index.js"
compatibility_date = "2026-11-18"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = [ "/api/*", "/admin", "/admin/*" ]

[observability]
enabled = true

[observability.traces]
enabled = true

# database_id 仍是占位。`npx wrangler d1 create holofen` 之后换成真的 id。
# preview_database_id 只给本机 `wrangler dev` 用。
[[d1_databases]]
binding = "DB"
database_name = "holofen"
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "local-holofen"
migrations_dir = "migrations"

# `wrangler preview` 不读上面的绑定，没有这个块就会构建失败。
# 线上还没有 D1，所以预览先不绑数据库。建好库之后，把同一个 id 加到这里：
# [[previews.d1_databases]]
# binding = "DB"
# database_name = "holofen"
# database_id = "换成 wrangler d1 create 印出的 id"
[previews.vars]
APP_ENV = "preview"
