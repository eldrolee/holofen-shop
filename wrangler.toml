# 这个仓库已经接到 Cloudflare Worker「holofen-shop」。
# main 分支的构建跑 `npx wrangler deploy`，其他分支跑 `npx wrangler preview`。
# 不要再另建一个 Pages 项目。
name = "holofen-shop"
main = "worker/index.js"
compatibility_date = "2026-11-18"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = [ "/api/*", "/admin", "/admin/*" ]

[observability]
enabled = true

[observability.traces]
enabled = true

# preview_database_id 只给本机 `wrangler dev` 用，不要改成线上的 id。
[[d1_databases]]
binding = "DB"
database_name = "holofen"
database_id = "e88d6a41-eeca-4580-87bd-af24d7368982"
preview_database_id = "local-holofen"
migrations_dir = "migrations"

# `wrangler preview` 不继承上面的绑定，所以预览要用同一份库再写一次。
[[previews.d1_databases]]
binding = "DB"
database_name = "holofen"
database_id = "e88d6a41-eeca-4580-87bd-af24d7368982"

[previews.vars]
APP_ENV = "preview"
